# Build and deploy the o-xtb documentation site to GitHub Pages.
#
# One build-and-deploy job.  `mkdocs build --strict` fails the job on a broken
# internal link or a navigation entry with no file; the separate external-link
# step is deliberately non-blocking because `--strict` never checks external
# URLs (it is the class of the dead help link this project once shipped).
#
# The pinned toolchain lives in `docs/docs-site/requirements.txt`.  The
# generated command-line chapters are produced from `src/xhelp.f90` before the
# gate and the build, so they are never committed and cannot go stale.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 node24
        with:
          python-version: '3.12'

      - name: Install the pinned documentation toolchain
        run: pip install -r docs/docs-site/requirements.txt

      - name: Generate the command-line reference from src/xhelp.f90
        run: python docs/docs-site/tools/gen_cli_reference.py

      - name: Local site gate (nav, links, JSON keys, report policy)
        run: python docs/docs-site/tools/check_site.py --no-generate

      - name: "Build the site (strict: broken links and nav entries fail)"
        run: mkdocs build --strict -f docs/docs-site/mkdocs.yml

      # `mkdocs build --strict` only checks internal links.  This step follows
      # the external http(s) links a reader can click in the built pages; it is
      # non-blocking, so a flaky third-party host does not redden the deploy.
      - name: Check external links (non-blocking)
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib, re, sys, urllib.request
          site = pathlib.Path("docs/docs-site/site")
          pattern = re.compile(r'<a[^>]+href="(https?://[^"#]+)"')
          links = sorted({m.group(1) for page in site.rglob("*.html")
                          for m in pattern.finditer(page.read_text(errors="ignore"))})
          dead = []
          for url in links:
              try:
                  request = urllib.request.Request(url, method="HEAD",
                                                   headers={"User-Agent": "oxtb-docs-linkcheck"})
                  urllib.request.urlopen(request, timeout=20)
              except Exception as error:  # noqa: BLE001 - report any failure
                  dead.append((url, str(error)))
          for url, error in dead:
              print(f"dead: {url} ({error})")
          print(f"checked {len(links)} external links, {len(dead)} failed")
          sys.exit(1 if dead else 0)
          PY

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 composite
        with:
          path: docs/docs-site/site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 node24
