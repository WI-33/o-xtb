            cat notes.md
         # One source of truth for what this run may do, so the three `gh` steps
         # cannot disagree: a tag push stages a draft, a dispatch stages a draft
         # and publishes it, a dispatch without `publish` creates nothing.
         - id: gate
           name: Decide whether this run may create a release
           run: |
            set -euo pipefail
            create=false
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              create=true
              echo "a tag push stages a draft release and leaves publishing to a human"
            elif [ "${PUBLISH_INPUT}" = "true" ]; then
              create=true
              echo "a dispatch with publish=true stages the draft and then publishes it"
            else
              echo "dry run: the packages and SHA256SUMS above are the whole output"
            fi
            echo "create=${create}" >> "$GITHUB_OUTPUT"
         # Idempotent on purpose: `gh release create` fails when a release for the
         # tag already exists, so a re-run reuses it and the `--clobber` upload
         # below replaces the assets (a duplicate asset name is a 422 otherwise).
         - name: Create the draft release
           if: steps.gate.outputs.create == 'true'
           run: |
            set -euo pipefail
            if gh release create "${TAG}" --draft --verify-tag \
                 --title "o-xtb ${VERSION} - xTB 6.7.1 engine" \
                 --notes-file notes.md; then
              echo "created draft release ${TAG}"
            elif gh release view "${TAG}" >/dev/null; then
              echo "draft release ${TAG} already exists; re-uploading its assets"
            else
              echo "::error::cannot create or find a release for ${TAG}"
              exit 1
            fi
         - name: Upload the assets
           if: steps.gate.outputs.create == 'true'
           run: |
            set -euo pipefail
            gh release upload "${TAG}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
            gh release view "${TAG}" --json assets --jq '.assets[].name'
         # Last, and only on request: publishing is what makes the release public
         # and, with immutable releases enabled, permanent.
         - name: Publish the release
           if: steps.gate.outputs.create == 'true' && env.PUBLISH_INPUT == 'true'
           run: |
            set -euo pipefail
            gh release edit "${TAG}" --draft=false
            gh release view "${TAG}" --json tagName,isDraft,url
