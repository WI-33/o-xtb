name: Build oxtb.exe with Intel MKL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Zastąpiono mingw-w64-ucrt-x86_64-openblas pakietem mkl
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-mkl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: |
          # Zmieniono dostawcę BLAS na Intel MKL (MKL)
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_Fortran_FLAGS_RELEASE="-O3 -DNDEBUG -march=skylake" \
                -DBLA_VENDOR=MKL \
                -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_OBJECT=OFF \
                -DWITH_TESTS=ON -DTEST_DRIVE_BUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j

      - name: Smoke test (water, GFN2 single point)
        run: |
          printf '3\nwater\nO 0.0 0.0 0.0\nH 0.758602 0.0 -0.504284\nH -0.758602 0.0 -0.504284\n' > water.xyz
          ./build/oxtb.exe water.xyz --sp --gfn 2

      - name: Prepare standalone distribution folder
        run: |
          mkdir dist
          cp build/oxtb.exe dist/
          # Kopiowanie bibliotek runtime specyficznych dla Intel MKL oraz gfortran
          cp /ucrt64/bin/libmkl_rt.dll dist/
          cp /ucrt64/bin/libgfortran-5.dll dist/
          cp /ucrt64/bin/libquadmath-0.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cp /ucrt64/bin/libgomp-1.dll dist/
          cp /ucrt64/bin/libgcc_s_ucrt-1.dll dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: oxtb-windows-x64-mkl-standalone
          path: dist/
