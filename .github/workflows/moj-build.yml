
name: Build xtb Windows MKL AVX2 (128 MiB stack)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      OMP_MAX_ACTIVE_LEVELS: "1"
      OMP_STACKSIZE: "64M"
      KMP_STACKSIZE: "64M"

    steps:
      - name: Checkout xtb source
        uses: actions/checkout@v4
        with:
          repository: grimme-lab/xtb
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Intel oneAPI HPC Toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0cb67a0d-67f6-410b-868b-f4a0a17ff0cf/intel-oneapi-toolkit-2026.1.1.32_offline.exe"
          $installer = Join-Path $env:RUNNER_TEMP "oneapi-offline.exe"

          Write-Host "Pobieranie instalatora Intel oneAPI..."
          curl.exe -L --fail --retry 3 --output $installer $url

          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się pobrać instalatora Intel oneAPI."
          }

          if (-not (Test-Path $installer)) {
            throw "Nie znaleziono pobranego instalatora."
          }

          Write-Host "Instalacja Intel oneAPI. Może potrwać kilka minut..."

          $arguments = @(
            "-s",
            "-a",
            "--silent",
            "--eula", "accept",
            "-p=NEED_VS2022_INTEGRATION=0"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Instalator Intel oneAPI zwrócił kod $($process.ExitCode)."
          }

          $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"

          if (-not (Test-Path $setvars)) {
            throw "Nie znaleziono setvars.bat po instalacji."
          }

          Write-Host "Intel oneAPI zainstalowane."

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          py -3 -m pip install --upgrade pip meson ninja

          if ($LASTEXITCODE -ne 0) {
            throw "Instalacja Meson/Ninja nie powiodła się."
          }

          py -3 -m meson --version
          py -3 -m ninja --version

      - name: Verify Intel compilers
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          where ifx
          if errorlevel 1 exit /b 1

          where icx
          if errorlevel 1 exit /b 1

          ifx --version
          icx --version

      - name: Configure and compile xtb with MKL
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          set FC=ifx
          set CC=icx

          set FCFLAGS=/O2 /QxCORE-AVX2 /Qopenmp
          set CFLAGS=/O2 /QxCORE-AVX2 /Qopenmp
          set CXXFLAGS=/O2 /QxCORE-AVX2

          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M

          py -3 -m meson setup build --buildtype=release --optimization=2 -Dlapack=mkl-rt
          if errorlevel 1 exit /b 1

          py -3 -m meson compile -C build -j 4
          if errorlevel 1 exit /b 1

          if not exist build\xtb.exe (
            echo ERROR: build\xtb.exe was not created.
            exit /b 1
          )

      - name: Set executable stack to 128 MiB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $PWD "build\xtb.exe"

          if (-not (Test-Path $exe)) {
            throw "Nie znaleziono build\xtb.exe."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "Nie znaleziono vswhere.exe."
          }

          $vsPath = & $vswhere -latest -products '*' -property installationPath

          if (-not $vsPath) {
            throw "Nie wykryto instalacji Visual Studio Build Tools."
          }

          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"

          $editbin = Get-ChildItem -Path $msvcRoot -Filter editbin.exe -Recurse |
            Where-Object {
              $_.FullName -match '\\Hostx64\\x64\\editbin\.exe$'
            } |
            Select-Object -First 1

          if ($null -eq $editbin) {
            throw "Nie znaleziono editbin.exe dla x64."
          }

          & $editbin.FullName /STACK:134217728 $exe

          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się ustawić stosu 128 MiB."
          }

          Write-Host "Ustawiono stos 128 MiB."

      - name: Smoke test with water
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M

          > water.xyz echo 3
          >> water.xyz echo water smoke test
          >> water.xyz echo O  0.000000  0.000000  0.000000
          >> water.xyz echo H  0.758602  0.000000  0.504284
          >> water.xyz echo H -0.758602  0.000000  0.504284

          build\xtb.exe water.xyz --sp --gfn 2
          if errorlevel 1 exit /b 1

          echo Test obliczeniowy zakonczony.

      - name: Package executable and parameter files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = Join-Path $PWD "xtb-windows-mkl"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exe = Join-Path $PWD "build\xtb.exe"
          Copy-Item $exe (Join-Path $dist "xtb.exe") -Force

          $parameterNames = @(
            "param_gfn0-xtb.txt",
            "param_gfn1-xtb.txt",
            "param_gfn2-xtb.txt",
            "param_ipea-xtb.txt",
            "param_gfnff.xtb",
            "param_gfnff-xtb.txt"
          )

          foreach ($name in $parameterNames) {
            $files = Get-ChildItem -Path $PWD -Filter $name -File -Recurse |
              Where-Object {
                $_.FullName -notlike "$dist\*"
              }

            foreach ($file in $files) {
              Copy-Item $file.FullName `
                (Join-Path $dist $file.Name) -Force
            }
          }

          $oneapiRoot = "C:\Program Files (x86)\Intel\oneAPI"

          # Dołącz dostępne biblioteki wykonawcze Intel/MKL.
          $runtimePatterns = @(
            "mkl_rt*.dll",
            "mkl_core*.dll",
            "mkl_intel_thread*.dll",
            "mkl_avx2*.dll",
            "libiomp5md.dll",
            "libifcoremd.dll",
            "libifportmd.dll",
            "libmmd.dll",
            "svml_dispmd.dll",
            "libirc.dll"
          )

          $runtimeDirs = @(
            (Join-Path $oneapiRoot "redist\intel64_win\compiler"),
            (Join-Path $oneapiRoot "redist\intel64_win\mkl"),
            (Join-Path $oneapiRoot "compiler\latest\bin"),
            (Join-Path $oneapiRoot "mkl\latest\bin")
          )

          foreach ($dir in $runtimeDirs) {
            if (Test-Path $dir) {
              foreach ($pattern in $runtimePatterns) {
                Get-ChildItem -Path $dir -Filter $pattern -File `
                  -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    Copy-Item $_.FullName `
                      (Join-Path $dist $_.Name) -Force
                  }
              }
            }
          }

          @'
          @echo off
          setlocal
          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M
          set XTBPATH=%~dp0
          "%~dp0xtb.exe" %*
          '@ | Set-Content `
            -Path (Join-Path $dist "run-xtb.bat") `
            -Encoding ascii

          @'
          Project: grimme-lab/xtb
          Compiler: Intel oneAPI ifx/icx
          Linear algebra backend: MKL runtime (mkl-rt)
          CPU target: AVX2
          Compile parallelism: 4 jobs
          Runtime thread limits: OMP=8, MKL=8
          Executable stack: 128 MiB
          Note: verify runtime DLL dependencies on the target Windows machine.
          '@ | Set-Content `
            -Path (Join-Path $dist "BUILD-INFO.txt") `
            -Encoding ascii

          Write-Host "Zawartość paczki:"
          Get-ChildItem $dist -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload Windows MKL artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtb-windows-mkl-avx2
          path: xtb-windows-mkl/
          if-no-files-found: error
          retention-days: 30
