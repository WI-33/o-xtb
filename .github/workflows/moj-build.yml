name: Build oxtb.exe (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_Fortran_FLAGS_RELEASE="-O2 -DNDEBUG -static" \
                -DBUILD_SHARED_LIBS=OFF \
                -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_OBJECT=OFF \
                -DWITH_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Smoke test (water, GFN2 single point)
        run: |
          printf '3\nwater\nO 0.0 0.0 0.0\nH 0.758602 0.0 -0.504284\nH -0.758602 0.0 -0.504284\n' > water.xyz
          ./build/oxtb.exe water.xyz --sp --gfn 2 | grep "total energy"

      - uses: actions/upload-artifact@v4
        with:
          name: oxtb-windows-x64
          path: build/oxtb.exe
