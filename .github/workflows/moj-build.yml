
name: Build xtb Windows MKL AVX2 - 128 MiB stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      OMP_MAX_ACTIVE_LEVELS: "1"
      OMP_STACKSIZE: "64M"
      KMP_STACKSIZE: "64M"

    steps:
      - name: Checkout official xtb source
        uses: actions/checkout@v4
        with:
          repository: grimme-lab/xtb
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Initialize MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Intel oneAPI Toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe"
          $installer = Join-Path $env:RUNNER_TEMP "oneapi-toolkit.exe"

          Write-Host "Pobieranie oficjalnego instalatora Intel oneAPI..."
          curl.exe -fL --retry 3 --retry-delay 5 `
            $url -o $installer

          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się pobrać instalatora Intel oneAPI."
          }

          if (-not (Test-Path $installer)) {
            throw "Brak pliku instalatora."
          }

          Write-Host "Uruchamianie cichej instalacji..."

          $arguments = @(
            "-s",
            "-a",
            "--silent",
            "--eula", "accept",
            "-p=NEED_VS2022_INTEGRATION=0"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Instalator Intel zakończył się kodem $($process.ExitCode)."
          }

          $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"

          if (-not (Test-Path $setvars)) {
            throw "Nie znaleziono setvars.bat po instalacji."
          }

          Write-Host "Intel oneAPI zainstalowane."

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Aktualizacja pip nie powiodła się."
          }

          python -m pip install --upgrade --force-reinstall meson ninja
          if ($LASTEXITCODE -ne 0) {
            throw "Instalacja Meson/Ninja nie powiodła się."
          }

          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          if ($LASTEXITCODE -ne 0) {
            throw "Nie można ustalić katalogu Scripts."
          }

          $scripts = $scripts.Trim()
          $meson = Join-Path $scripts "meson.exe"
          $ninja = Join-Path $scripts "ninja.exe"

          if (-not (Test-Path $meson)) {
            throw "Brak meson.exe: $meson"
          }

          if (-not (Test-Path $ninja)) {
            throw "Brak ninja.exe: $ninja"
          }

          "$scripts" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append -Encoding utf8

          & $meson --version
          if ($LASTEXITCODE -ne 0) {
            throw "Nie można uruchomić Meson."
          }

          & $ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw "Nie można uruchomić Ninja."
          }

      - name: Verify Intel compiler and MKL environment
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          where ifx
          if errorlevel 1 exit /b 1

          where icx
          if errorlevel 1 exit /b 1

          ifx --version
          if errorlevel 1 exit /b 1

          icx --version
          if errorlevel 1 exit /b 1

          if not defined MKLROOT (
            echo ERROR: MKLROOT is not defined.
            exit /b 1
          )

          echo MKLROOT=%MKLROOT%
          if not exist "%MKLROOT%" exit /b 1

      - name: Configure xtb with Intel compilers and MKL
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          set FC=ifx
          set CC=icx

          set FCFLAGS=/O2 /QxCORE-AVX2 /Qopenmp
          set CFLAGS=/O2 /QxCORE-AVX2
          set CXXFLAGS=/O2 /QxCORE-AVX2

          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M

          meson setup build --buildtype=release --optimization=2 -Dlapack=mkl-rt -Dfortran_link_args=/Qopenmp
          if errorlevel 1 exit /b 1

      - name: Compile xtb - four parallel jobs
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M

          meson compile -C build -j 4
          if errorlevel 1 exit /b 1

          if not exist build\xtb.exe (
            echo ERROR: build\xtb.exe was not created.
            exit /b 1
          )

      - name: Set executable stack to 128 MiB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $PWD "build\xtb.exe"
          if (-not (Test-Path $exe)) {
            throw "Nie znaleziono build\xtb.exe."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Nie znaleziono vswhere.exe."
          }

          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) {
            throw "Nie znaleziono Visual Studio."
          }

          $msvc = Join-Path $vsPath "VC\Tools\MSVC"
          $editbin = Get-ChildItem -Path $msvc -Filter editbin.exe -Recurse |
            Where-Object {
              $_.FullName -match '\\Hostx64\\x64\\editbin\.exe$'
            } |
            Select-Object -First 1

          if ($null -eq $editbin) {
            throw "Nie znaleziono editbin.exe."
          }

          & $editbin.FullName /STACK:134217728 $exe
          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się ustawić stosu 128 MiB."
          }

          Write-Host "Ustawiono stos 128 MiB."

      - name: Smoke test
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1

          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M

          > water.xyz echo 3
          >> water.xyz echo water smoke test
          >> water.xyz echo O  0.000000  0.000000  0.000000
          >> water.xyz echo H  0.758602  0.000000  0.504284
          >> water.xyz echo H -0.758602  0.000000  0.504284

          build\xtb.exe water.xyz --sp --gfn 2
          if errorlevel 1 exit /b 1

          echo Test obliczeniowy zakończony.

      - name: Package executable and runtime libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = Join-Path $PWD "xtb-windows-mkl"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item `
            (Join-Path $PWD "build\xtb.exe") `
            (Join-Path $dist "xtb.exe") -Force

          $patterns = @(
            "param_gfn0-xtb.txt",
            "param_gfn1-xtb.txt",
            "param_gfn2-xtb.txt",
            "param_ipea-xtb.txt",
            "param_gfnff.xtb",
            "param_gfnff-xtb.txt"
          )

          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $PWD -Filter $pattern -File -Recurse |
              Where-Object {
                $_.FullName -notlike "$dist\*"
              } |
              ForEach-Object {
                Copy-Item $_.FullName `
                  (Join-Path $dist $_.Name) -Force
              }
          }

          $oneapi = "C:\Program Files (x86)\Intel\oneAPI"

          $runtimePatterns = @(
            "mkl_rt*.dll",
            "mkl_core*.dll",
            "mkl_intel_thread*.dll",
            "mkl_avx2*.dll",
            "libiomp5md.dll",
            "libifcoremd.dll",
            "libifportmd.dll",
            "libmmd.dll",
            "svml_dispmd.dll",
            "libirc.dll"
          )

          $runtimeDirs = @(
            (Join-Path $oneapi "redist\intel64_win\compiler"),
            (Join-Path $oneapi "redist\intel64_win\mkl"),
            (Join-Path $oneapi "compiler\latest\bin"),
            (Join-Path $oneapi "mkl\latest\bin")
          )

          foreach ($dir in $runtimeDirs) {
            if (Test-Path $dir) {
              foreach ($pattern in $runtimePatterns) {
                Get-ChildItem -Path $dir -Filter $pattern -File `
                  -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    Copy-Item $_.FullName `
                      (Join-Path $dist $_.Name) -Force
                  }
              }
            }
          }

          @'
          @echo off
          setlocal
          set OMP_NUM_THREADS=8
          set MKL_NUM_THREADS=8
          set OMP_DYNAMIC=FALSE
          set MKL_DYNAMIC=FALSE
          set OMP_MAX_ACTIVE_LEVELS=1
          set OMP_STACKSIZE=64M
          set KMP_STACKSIZE=64M
          set XTBPATH=%~dp0
          "%~dp0xtb.exe" %*
          '@ | Set-Content `
            -Path (Join-Path $dist "run-xtb.bat") `
            -Encoding ascii

          @'
          Project: grimme-lab/xtb
          Compiler: Intel oneAPI ifx/icx
          BLAS/LAPACK: MKL runtime
          CPU target: AVX2
          Compile jobs: 4
          Runtime thread limits: OMP=8, MKL=8
          Executable stack: 128 MiB
          Check runtime dependencies before using on another PC.
          '@ | Set-Content `
            -Path (Join-Path $dist "BUILD-INFO.txt") `
            -Encoding ascii

          Write-Host "Zawartość paczki:"
          Get-ChildItem $dist -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtb-windows-mkl-avx2
          path: xtb-windows-mkl/
          if-no-files-found: error
          retention-days: 30
