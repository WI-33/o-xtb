name: Package g-xTB Windows binary (stack 128 MiB)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gxtb-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout g-xTB repository (contains official binaries)
        uses: actions/checkout@v4
        with:
          repository: grimme-lab/g-xtb
          ref: main
          path: g-xtb-src

      - name: Prepare MSVC tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Extract official Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem 'g-xtb-src\binaries\*windows-x86_64.zip' | Select-Object -First 1
          if (-not $zip) {
            throw 'Official Windows x86_64 ZIP was not found in grimme-lab/g-xtb/binaries.'
          }
          New-Item -ItemType Directory -Force -Path 'stage' | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath 'stage' -Force
          $exe = Get-ChildItem 'stage' -Recurse -Filter 'xtb.exe' | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem 'stage' -Recurse | Format-Table FullName
            throw 'xtb.exe was not found in the official ZIP.'
          }
          $stageRoot = (Resolve-Path 'stage').Path
          $relativeExe = [System.IO.Path]::GetRelativePath($stageRoot, $exe.FullName)
          $relativeExe = $relativeExe -replace '/', '\\'
          "XTB_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XTB_REL=$relativeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found executable: $($exe.FullName)"
          Write-Host "Relative executable path: $relativeExe"
          Get-ChildItem 'stage' -Recurse | Select-Object FullName,Length

      - name: Set Windows executable stack reserve to 128 MiB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command editbin.exe -ErrorAction SilentlyContinue)) {
            throw 'editbin.exe is unavailable on this runner; cannot apply the requested PE stack-reserve change.'
          }
          & editbin.exe /STACK:134217728 "$env:XTB_EXE"
          if ($LASTEXITCODE -ne 0) {
            throw "editbin failed with exit code $LASTEXITCODE"
          }

      - name: Smoke test g-xTB calculation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          3
          water smoke test
          O  0.000000  0.000000  0.000000
          H  0.758602  0.000000  0.504284
          H -0.758602  0.000000  0.504284
          '@ | Set-Content -Path 'water.xyz' -Encoding ascii

          $env:OMP_NUM_THREADS = '1'
          $env:OMP_STACKSIZE = '64m'
          $env:KMP_STACKSIZE = '64m'
          $env:PATH = "$(Split-Path -Parent $env:XTB_EXE);$env:PATH"
          Push-Location (Split-Path -Parent $env:XTB_EXE)
          try {
            & "$env:XTB_EXE" "$env:GITHUB_WORKSPACE\water.xyz" --gxtb --sp
            if ($LASTEXITCODE -ne 0) {
              throw "g-xTB smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Package Windows binary and runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item -Path 'stage\*' -Destination 'dist' -Recurse -Force
          $relativeExe = $env:XTB_REL
          $exeDirectory = Split-Path -Parent $relativeExe
          if ([string]::IsNullOrWhiteSpace($exeDirectory)) { $exeDirectory = '.' }
          @"
          @echo off
          setlocal
          set "OMP_NUM_THREADS=1"
          set "OMP_STACKSIZE=64m"
          set "KMP_STACKSIZE=64m"
          set "PATH=%~dp0$exeDirectory;%PATH%"
          "%~dp0$relativeExe" %*
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Path 'dist\run-gxtb.bat' -Encoding ascii
          Compress-Archive -Path 'dist\*' -DestinationPath 'g-xtb-windows-x64-stack128.zip' -Force

      - name: Upload g-xTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: g-xtb-windows-x64-stack128
          path: g-xtb-windows-x64-stack128.zip
          if-no-files-found: error
          retention-days: 14
