name: Build oxtb.exe (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-mkl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: |
          # Jawnym wymuszeniem flag kompilacji i linkera omijamy błędy wewnętrzne skryptów CMake w xtb.
          # Flaga -march=skylake odblokowuje pełną moc instrukcji AVX2 dla i7-6820HQ.
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_Fortran_FLAGS="-O3 -DNDEBUG -march=skylake" \
                -DCMAKE_C_FLAGS="-O3 -DNDEBUG -march=skylake" \
                -DEXTERNAL_BLAS=ON \
                -DEXTERNAL_LAPACK=ON \
                -DBlas_F90_INTERFACE=gfortran \
                -DBLAS_LIBRARIES="-lmkl_rt" \
                -DLAPACK_LIBRARIES="-lmkl_rt" \
                -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_OBJECT=OFF \
                -DWITH_TESTS=ON -DTEST_DRIVE_BUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j

      - name: Smoke test (water, GFN2 single point)
        run: |
          printf '3\nwater\nO 0.0 0.0 0.0\nH 0.758602 0.0 -0.504284\nH -0.758602 0.0 -0.504284\n' > water.xyz
          ./build/oxtb.exe water.xyz --sp --gfn 2

      - name: Prepare standalone distribution folder
        run: |
          mkdir dist
          cp build/oxtb.exe dist/
          # Kopiowanie biblioteki uruchomieniowej Intel MKL oraz niezbędnego zestawu DLL z GCC
          cp /ucrt64/bin/libmkl_rt.dll dist/
          cp /ucrt64/bin/libgfortran-5.dll dist/
          cp /ucrt64/bin/libquadmath-0.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cp /ucrt64/bin/libgomp-1.dll dist/
          cp /ucrt64/bin/libgcc_s_ucrt-1.dll dist/ || true

      - uses: actions/upload-artifact@v4.6.1
        with:
          name: oxtb-windows-x64-standalone
          path: dist/
