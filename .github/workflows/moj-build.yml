# Natywna kompilacja o-xtb na Windows przy użyciu Intel OneAPI (ifx) oraz Intel MKL.
# Wersja w pełni niezależna, zoptymalizowana i w 100% statyczna dla i7-6820HQ (Skylake).
name: Windows Intel MKL Static Build
on:
   push:
   pull_request:
   workflow_dispatch:
env:
   BUILD_DIR: _build
jobs:
   intel-mkl-cmake-build:
      runs-on: windows-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         # Zaktualizowana wersja v1.4, która poprawnie obsługuje instalację Intel MKL i konfigurację zmiennych
         - name: Install Intel Fortran Compiler (ifx) & MKL
           uses: fortran-lang/setup-fortran@v1.4
           with:
             compiler: intel
             install_mkl: true
             update-environment: true

         # Konfiguracja kompilacji:
         # /O3 /QxCORE-AVX2 -> Maksymalna optymalizacja pod instrukcje AVX2/FMA3 dla Twojego i7
         # /MT -> Wbudowanie bibliotek uruchomieniowych C/C++ w plik .exe
         # /Qmkl:sequential -> Wstrzykuje kompletny, statyczny kod MKL bezpośrednio do pliku wykonywalnego
         # /link /STACK:16777216 -> Zwiększa pamięć podręczną stosu do 16MB zapobiegając Stack Overflow
         - name: Configure build
           shell: cmd
           run: |
            cmake -B "%BUILD_DIR%" -G Ninja ^
            -DCMAKE_Fortran_COMPILER=ifx ^
            -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_OBJECT=OFF -DWITH_TESTS=ON ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_Fortran_FLAGS_RELEASE="/O3 /QxCORE-AVX2 /MT /Qmkl:sequential /DNDEBUG" ^
            -DCMAKE_EXE_LINKER_FLAGS="/link /STACK:16777216" ^
            -DTEST_DRIVE_BUILD_TESTING=OFF

         # Kompilacja całego projektu przy użyciu Ninja
         - name: Build project
           shell: cmd
           run: |
            cmake --build "%BUILD_DIR%" --parallel

         # Testy numeryczne uruchamiane na 4 rdzeniach procesora i7
         - name: Run the bounded test subset
           shell: cmd
           run: |
            cd "%BUILD_DIR%"
            set OMP_NUM_THREADS=4
            ctest --output-on-failure -R "^(o-xtb/gfn2|o-xtb/landscape-optimize-math|xtb/Argparser_print_(version|help|license)|xtb/Info|xtb/xtbpath-default|xtb/landscape-(opt|opt-energy|ljson-default|gfn-value))$" -E "o-xtb/docking|xtb/CAPI|mctc-lib/ncoord"
           
         # Przygotowanie czystej i niezależnej paczki z binariami oraz parametrami obliczeniowymi
         - name: Package artifacts
           shell: cmd
           run: |
            mkdir dist\bin
            mkdir dist\share\o-xtb
            xcopy /Y "%BUILD_DIR%\oxtb.exe" dist\bin\
            xcopy /Y "param_*.txt" dist\share\o-xtb\ 2>nul || (exit 0)
            xcopy /Y ".param_gfnff.xtb" dist\share\o-xtb\ 2>nul || (exit 0)
         
         # Zapis gotowej, skompresowanej paczki ZIP na serwerze GitHub Actions
         - name: Upload Windows executable
           uses: actions/upload-artifact@v4
           with:
            name: oxtb-windows-intel-mkl-static
            path: dist/
            if-no-files-found: error
