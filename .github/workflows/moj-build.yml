# Experimental native Windows build of o-xtb with Intel oneMKL.
# Start manually from Actions -> Windows MKL -> Run workflow.
# This deliberately leaves windows-cmake.yml (OpenBLAS) unchanged.
name: Windows MKL (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Installs the Intel oneAPI HPC Toolkit, which provides ifx and oneMKL.
      # Installer availability/winget metadata can change; this step verifies
      # the required tools instead of silently falling back to OpenBLAS.
      - name: Install Intel oneAPI HPC Toolkit
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id Intel.OneAPI.HPCToolkit --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget could not install Intel oneAPI HPC Toolkit (exit $LASTEXITCODE). See the step log; no OpenBLAS fallback is attempted."
          }

      - name: Initialize oneAPI environment and verify compiler/MKL
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64
          if errorlevel 1 exit /b 1
          where ifx
          if errorlevel 1 exit /b 1
          if not defined MKLROOT exit /b 1
          if not exist "%MKLROOT%\lib\mkl_rt.lib" exit /b 1
          echo MKLROOT=%MKLROOT%>>%GITHUB_ENV%
          echo PATH=%PATH%>>%GITHUB_ENV%
          echo LIB=%LIB%>>%GITHUB_ENV%
          echo INCLUDE=%INCLUDE%>>%GITHUB_ENV%

      - name: Install CMake and Ninja
        run: |
          python -m pip install --upgrade cmake ninja

      # This source tree currently adds GNU ld flags (-static and -Wl,...) to
      # every WIN32 build. Those flags are not valid for the native Intel/MSVC
      # linker, so narrow that block to GNU/MinGW builds. The change is applied
      # only in the CI checkout and does not modify the repository.
      - name: Make Windows linker flags compiler-specific
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib, re
          p = pathlib.Path("CMakeLists.txt")
          s = p.read_text(encoding="utf-8")
          pattern = re.compile(r'if\(WIN32\)\s+target_link_options\(\s*\$\{XTB_EXE_NAME\}\s+PRIVATE\s+"-static"\s+"-Wl,--stack=16777216"\s+\)\s+endif\(\)', re.M)
          replacement = '''if(WIN32 AND CMAKE_Fortran_COMPILER_ID STREQUAL "GNU")
            target_link_options(
              ${XTB_EXE_NAME}
              PRIVATE
              "-static"
              "-Wl,--stack=16777216"
            )
          endif()'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit("Expected GNU-only Windows linker block not found; refusing to patch.")
          p.write_text(s2, encoding="utf-8", newline="")
          '@ | Set-Content -Encoding ascii patch_windows_link.py
          python patch_windows_link.py
          if ($LASTEXITCODE -ne 0) { throw 'CMake linker patch failed.' }

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure with Intel Fortran and MKL
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_Fortran_COMPILER=ifx `
            -DCMAKE_C_COMPILER=icx `
            '-DCMAKE_Fortran_FLAGS_RELEASE=/O2 /DNDEBUG' `
            -DBLA_VENDOR=Intel10_64lp `
            -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_OBJECT=OFF `
            -DWITH_TESTS=ON -DTEST_DRIVE_BUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build
        run: |
          cmake --build build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Smoke test (water, GFN2 single point)
        run: |
          @'
          3
          water
          O 0.0 0.0 0.0
          H 0.758602 0.0 -0.504284
          H -0.758602 0.0 -0.504284
          '@ | Set-Content -Encoding ascii water.xyz
          .\build\oxtb.exe water.xyz --sp --gfn 2
          if ($LASTEXITCODE -ne 0) { throw 'GFN2 water smoke test failed.' }

      - name: Package executable and Intel runtime DLLs
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path '.\build\oxtb.exe')) { throw 'oxtb.exe was not produced.' }
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item '.\build\oxtb.exe' $dist -Force

          # BLA_VENDOR=Intel10_64lp can link MKL component libraries rather than
          # mkl_rt.dll. Therefore mkl_rt.dll is optional, not a build requirement.
          # Find Intel runtime DLLs in the installed oneAPI tree and copy common
          # runtime dependencies if present.
          $roots = @(
            $env:MKLROOT,
            'C:\Program Files (x86)\Intel\oneAPI\compiler',
            'C:\Program Files (x86)\Intel\oneAPI\mkl'
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $wanted = @('mkl_rt.dll', 'libiomp5md.dll', 'svml_dispmd.dll', 'libifcoremd.dll', 'libifportmd.dll', 'libmmd.dll')
          foreach ($root in $roots) {
            foreach ($name in $wanted) {
              Get-ChildItem -Path $root -Filter $name -File -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $destination = Join-Path $dist $_.Name
                  if (-not (Test-Path $destination)) { Copy-Item $_.FullName $destination -Force }
                }
            }
          }

          # Show what was collected. Do not fail solely because mkl_rt.dll is
          # absent: the selected MKL interface may use component libraries.
          Get-ChildItem $dist -File | Select-Object Name, Length
          Copy-Item '.\build\share' $dist -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: oxtb-windows-x64-mkl-experimental
          path: dist/
          if-no-files-found: error
