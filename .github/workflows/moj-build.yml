# Windows row: a native `oxtb.exe` build on `windows-latest` with MSYS2.
# Highly optimized for Intel Core i7-6820HQ (Skylake architecture).
name: Windows Skylake Build
on:
   push:
   pull_request:
   workflow_dispatch:
env:
   BUILD_DIR: _build
jobs:
   mingw-ucrt64-cmake-build:
      runs-on: windows-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v5
         - name: Setup MSYS2
           uses: msys2/setup-msys2@v2
           with:
            msystem: UCRT64
            update: true
            install: >-
             git
             mingw-w64-ucrt-x86_64-gcc-fortran
             mingw-w64-ucrt-x86_64-openblas
             mingw-w64-ucrt-x86_64-cmake
             mingw-w64-ucrt-x86_64-ninja
             mingw-w64-ucrt-x86_64-python
         
         # Konfiguracja zoptymalizowana pod i7-6820HQ (Skylake) z użyciem flag -O3, -march=skylake oraz -mtune=skylake
         - name: Configure build
           shell: msys2 {0}
           run: >
            cmake -B "$BUILD_DIR" -G Ninja
            -DWITH_TBLITE=OFF -DWITH_CPCMX=OFF -DWITH_OBJECT=OFF -DWITH_TESTS=ON
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_Fortran_FLAGS_RELEASE="-O3 -march=skylake -mtune=skylake -DNDEBUG"
            -DBLA_VENDOR=OpenBLAS
            -DTEST_DRIVE_BUILD_TESTING=OFF
         
         - name: Build project
           shell: msys2 {0}
           run: |
            set -eo pipefail
            cmake --build "$BUILD_DIR" 2>&1 | tee build.log
            if grep -qiE 'Error: |Fatal' build.log; then
              echo "::error::the build log contains an 'Error:' or 'Fatal' line"
              exit 1
            fi
         
         # Testy uruchamiane na 4 wątkach, aby sprawdzić stabilność OpenMP na architekturze Skylake
         - name: Run the bounded test subset
           shell: msys2 {0}
           run: |
             log="$(cygpath -u "$RUNNER_TEMP")/ctest.log"
             summary="$(cygpath -u "$GITHUB_STEP_SUMMARY")"
             set +e
             ctest --output-on-failure \
               -R '^(o-xtb/gfn2|o-xtb/landscape-optimize-math|xtb/Argparser_print_(version|help|license)|xtb/Info|xtb/xtbpath-default|xtb/landscape-(opt|opt-energy|ljson-default|gfn-value))$' \
               -E 'o-xtb/docking|xtb/CAPI|mctc-lib/ncoord' 2>&1 | tee "$log"
             status=${PIPESTATUS[0]}
             {
               echo "### Unit tests: exit ${status}"
               if [ "${status}" -ne 0 ]; then
                 echo '```'
                 sed -n '/The following tests FAILED/,p' "log" | head -40
                 echo '```'
               fi
             } >> "$summary"
             if [ "${status}" -ne 0 ]; then
               sed -n '/The following tests FAILED/,$p' "$log" | head -40 | \
                 while IFS= read -r line; do
                   printf '::error::%s\n' "$line"
                 done
             fi
             exit "${status}"
           working-directory: ${{ env.BUILD_DIR }}
           env:
            OMP_NUM_THREADS: 4
            
