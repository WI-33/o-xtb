name: CI
on: [push, pull_request]
env:
   BUILD_DIR: _build
jobs:
   # Only the CMake builds survive.  The seven jobs that drove the repository's
   # former build system (the source distribution and the gcc / lightweight /
   # MinGW / Intel builds) were removed together with it, and the
   # `continuous-delivery` release pipeline went with them (see the note at the
   # end of this file).
   #
   # The row set of this push path was narrowed when report 175 measured the
   # informational rows: the aarch64 Release combination and the Intel ifx row
   # are no longer here.  The remaining informational row is the aarch64 Debug
   # build; the second Fortran front end moved to the weekly
   # `.github/workflows/intel-ifx-weekly.yml`.
   gcc-cmake-build:
      # The aarch64 runner is informational: its failures could not be reproduced
      # on x86-64 with the same compiler, so it must not gate the build.
      continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
      runs-on: ${{ matrix.os }}
      # Runner labels are pinned, never `-latest` (report 212): GitHub announced
      # that `ubuntu-latest` moves to Ubuntu 26 from 2026-10-19, so an unpinned
      # label can swap the whole toolchain without a commit here - and with it the
      # compiler that report 209's byte-for-byte reproducibility was measured on.
      # `ubuntu-24.04` is what `ubuntu-latest` resolves to today.
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-24.04, ubuntu-24.04-arm]
            fc: [gfortran-14]
            cc: [gcc-14]
            build: [Release, Debug]
            # The aarch64 Release combination was cancelled (report 175): it is
            # 2.9 min of runner time per push and its failures include an
            # inherited upstream test asserting an absolute 1e-8 tolerance,
            # while the ISA stays covered by the cheap, green aarch64 Debug
            # row.  The aarch64 `-O2` codegen residue is picked up by the
            # weekly non-GNU run in `.github/workflows/intel-ifx-weekly.yml`.
            exclude:
              - os: ubuntu-24.04-arm
                build: Release
      # Every `uses:` is a full commit SHA with the release it is, because a moved
      # tag is arbitrary code on a runner that holds a token (report 212).  The
      # runtime of each pin is stated next to it and was read from that release's
      # own `action.yml`.
      steps:
         - name: Checkout code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24
         - name: Setup Python
           uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 node24
           with:
            python-version: 3.x
         - name: Install OpenBLAS (Ubuntu)
           if: ${{ contains(matrix.os, 'ubuntu') }}
           run: |
            sudo apt-get install libopenblas-dev
         - name: Install CMake
           run: pip install ninja cmake
         # -O2 is pinned explicitly because CMake's `Release` default for GNU is
         # -O3, which this checkout does not support (cmake/CMakeLists.txt warns
         # on it: gfortran gave wrong Hessian results at -O3 for a numerically
         # related source state).  The `Debug` configuration ignores the flag.
         - name: Configure build
           run: >
            cmake -B ${{ env.BUILD_DIR }} -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build }}
            -DCMAKE_Fortran_FLAGS_RELEASE="-O2 -DNDEBUG"
            -DTEST_DRIVE_BUILD_TESTING=OFF
           env:
            FC: ${{ matrix.fc }}
            CC: ${{ matrix.cc }}
         # A non-zero exit status of the build alone is not the gate: the log is
         # also scanned for compiler diagnostics.  `-i` is required because
         # gfortran spells the diagnostic `Error:` with a capital E.
         - name: Build project
           run: |
            set -eo pipefail
            cmake --build ${{ env.BUILD_DIR }} 2>&1 | tee build.log
            if grep -qiE 'Error: |Fatal' build.log; then
              echo "::error::the build log contains an 'Error:' or 'Fatal' line"
              exit 1
            fi
         # `mctc-lib/ncoord` alone takes ~156 s and would dominate the job; the
         # rest of the suite runs.  `xtb/landscape-blas-threads-timing` is
         # excluded too: it asserts a 3x wall clock speedup on a shared runner
         # and is load sensitive (observed flaky under load), while the
         # assertion itself is unchanged and the check still runs in the local
         # `ctest -R landscape` suite.  `s-dftd3/` and `tblite/` are the fetched
         # dependencies' own test suites: in Debug their code trips this build's
         # `-ffpe-trap` (SIGFPE, not a numerical mismatch - report 155), and
         # their tests cannot be switched off selectively because `WITH_TESTS`
         # is shared with this project's own tests.
         - name: Run unit tests
           # The failing-test list goes to the job summary as well as to the log:
           # reading the log needs an authenticated API call, the summary does not.
           # Each failing test is also emitted as a workflow command, which GitHub
           # turns into a check-run annotation: that is readable through the public
           # API without a token.
           run: |
             set +e
             ctest --parallel --output-on-failure -E 'mctc-lib/ncoord|xtb/landscape-blas-threads-timing|s-dftd3/|tblite/' 2>&1 | tee "$RUNNER_TEMP/ctest.log"
             status=${PIPESTATUS[0]}
             {
               echo "### Unit tests: exit ${status}"
               if [ "${status}" -ne 0 ]; then
                 echo '```'
                 sed -n '/The following tests FAILED/,$p' "$RUNNER_TEMP/ctest.log" | head -40
                 echo '```'
               fi
             } >> "$GITHUB_STEP_SUMMARY"
             if [ "${status}" -ne 0 ]; then
               sed -n '/The following tests FAILED/,$p' "$RUNNER_TEMP/ctest.log" | head -40 | \
                 while IFS= read -r line; do
                   printf '::error::%s\n' "$line"
                 done
             fi
             exit "${status}"
           working-directory: ${{ env.BUILD_DIR }}
           env:
            OMP_NUM_THREADS: 2,1

   xtb-lightweight-cmake-build:
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-24.04]
            fc: [gfortran-14]
            cc: [gcc-14]
      steps:
         - name: Checkout code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24
         - name: Setup Python
           uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 node24
           with:
            python-version: 3.x
         - name: Install OpenBLAS (Ubuntu)
           if: ${{ contains(matrix.os, 'ubuntu') }}
           run: |
            sudo apt-get install libopenblas-dev
         - name: Install CMake
           run: pip3 install ninja cmake
         # No CMAKE_BUILD_TYPE is set, so this job never builds at -O3: it is a
         # fast compile smoke test of the tblite/cpcmx-disabled configuration
         # and stays unoptimised on purpose.
         - name: Configure build
           run: cmake -B ${{ env.BUILD_DIR }} -DWITH_CPCMX=false -DWITH_TBLITE=false -DTEST_DRIVE_BUILD_TESTING=OFF -G Ninja
           env:
            FC: ${{ matrix.fc }}
            CC: ${{ matrix.cc }}
         - name: Build project
           run: |
            set -eo pipefail
            cmake --build ${{ env.BUILD_DIR }} 2>&1 | tee build.log
            if grep -qiE 'Error: |Fatal' build.log; then
              echo "::error::the build log contains an 'Error:' or 'Fatal' line"
              exit 1
            fi
         - name: Run unit tests
           # The failing-test list goes to the job summary as well as to the log:
           # reading the log needs an authenticated API call, the summary does not.
           # Each failing test is also emitted as a workflow command, which GitHub
           # turns into a check-run annotation: that is readable through the public
           # API without a token.  The `s-dftd3/` and `tblite/` entries of the
           # filter are the fetched dependencies' own test suites, which this
           # job does not build (see the filter note in `gcc-cmake-build`).
           run: |
             set +e
             ctest --parallel --output-on-failure -E 'mctc-lib/ncoord|xtb/landscape-blas-threads-timing|s-dftd3/|tblite/' 2>&1 | tee "$RUNNER_TEMP/ctest.log"
             status=${PIPESTATUS[0]}
             {
               echo "### Unit tests: exit ${status}"
               if [ "${status}" -ne 0 ]; then
                 echo '```'
                 sed -n '/The following tests FAILED/,$p' "$RUNNER_TEMP/ctest.log" | head -40
                 echo '```'
               fi
             } >> "$GITHUB_STEP_SUMMARY"
             if [ "${status}" -ne 0 ]; then
               sed -n '/The following tests FAILED/,$p' "$RUNNER_TEMP/ctest.log" | head -40 | \
                 while IFS= read -r line; do
                   printf '::error::%s\n' "$line"
                 done
             fi
             exit "${status}"
           working-directory: ${{ env.BUILD_DIR }}
           env:
            OMP_NUM_THREADS: 2,1

   # The `continuous-delivery` release pipeline was removed together with the
   # repository's former build system: this repository now builds with CMake
   # only, and every artifact that pipeline published (xtb-bleed.tar.xz,
   # xtb-bleed-linux-x86_64.tar.xz, xtb-bleed-windows.zip) was produced by a job
   # of the deleted system (the source-dist, Intel and MinGW static package
   # jobs), so it had no producer left.  Restoring automated releases means
   # rebuilding source and platform package creation and upload on top of CMake;
   # that is a separate task.
